name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Formatação
        run: ./mvnw -B spotless:check
      - name: Testes, incluindo SQL Server com Testcontainers
        run: ./mvnw -B verify
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api
          path: api/target/site/jacoco

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Formatação
        run: npm run verificar-formato
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm run testar
      - name: Build
        run: npm run build

  imagens:
    if: github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagem da API
        run: docker build -t uniquiz-api:${{ github.sha }} api
      - name: Imagem do aplicativo web
        run: docker build -t uniquiz-web:${{ github.sha }} web
