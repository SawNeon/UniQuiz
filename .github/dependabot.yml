version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      desenvolvimento:
        dependency-type: development

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
